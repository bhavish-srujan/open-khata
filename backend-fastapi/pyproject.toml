[project]
name = "backend-fastapi"
version = "0.1.0"
description = "FastAPI backend for Open Khata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
