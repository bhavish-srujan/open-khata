services:
  db:
    image: postgres:15
    container_name: khatabook-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: khatabook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3-compatible object storage for local development and tests. The
  # production driver talks to this exactly as it talks to R2 or S3.
  minio:
    image: minio/minio:latest
    container_name: khatabook-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
