services:
  - type: web
    name: khatabook-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_USERNAME
        sync: false
      - key: SMS_GATEWAY_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
